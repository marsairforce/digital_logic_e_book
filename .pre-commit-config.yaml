# Pre-commit checks for the book.
#
# rumdl first (fast, per-file): the Markdown linter Travis already uses
# in VS Code, driven by the repo's own .rumdl.toml. Lint only — it never
# rewrites files. pre-commit installs rumdl itself in an isolated
# environment, so no manual rumdl install is needed for the hook.
#
# The VitePress build is the book's real "lint" for links and rendering:
# it fails on dead links (the Chapter 2 .kicad_sch links broke it) and on
# pages that do not render. Running it here catches those failures before
# a commit, instead of in the Pages workflow after a merge.
#
# Setup (once per checkout):
#   pip install pre-commit   # or: pipx install pre-commit
#   npm ci                   # the hook runs the local VitePress install
#   pre-commit install
#
# Run it by hand any time with: pre-commit run --all-files
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.67
    hooks:
      - id: rumdl
        # notes/ is the raw quarry, deliberately untouched by the book's
        # editing passes — do not lint it into shape.
        exclude: ^notes/
  - repo: local
    hooks:
      - id: vitepress-build
        name: VitePress build
        entry: npm run docs:build
        language: system
        pass_filenames: false
        always_run: true
